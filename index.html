<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Workouts</title>
<style>
  /* ===== ЦВЕТА И БАЗА ===== */
  :root {
    --bg-color: #F4F6F8;         /* Светло-серый фон страницы */
    --card-bg: #FFFFFF;          /* Белый для карточек */
    --lime: #C3F84A;             /* Лаймовый акцент (как на референсе) */
    --dark: #111315;             /* Почти черный для контраста */
    --text-main: #111315;        /* Основной текст */
    --text-muted: #88909D;       /* Серый текст */
    --border-color: #EAECEF;     /* Легкие рамки */
    --radius-xl: 32px;           /* Огромные скругления как на референсе */
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
    
    /* Тени */
    --shadow: 0 10px 40px rgba(0, 0, 0, 0.03);
    --shadow-hover: 0 15px 50px rgba(0, 0, 0, 0.06);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  
  body {
    background-color: var(--bg-color);
    color: var(--text-main);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 20px;
    -webkit-font-smoothing: antialiased;
  }

  /* ===== СЕТКА ИНТЕРФЕЙСА ===== */
  .app-container {
    display: grid;
    grid-template-columns: 240px 1fr 300px;
    gap: 20px;
    width: 100%;
    max-width: 1400px;
    height: calc(100vh - 40px);
  }

  /* ===== БОКОВАЯ ПАНЕЛЬ ===== */
  .sidebar {
    background: var(--card-bg);
    border-radius: var(--radius-xl);
    padding: 30px 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }
  .logo {
    font-size: 20px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 40px;
    padding-left: 10px;
  }
  .logo-icon {
    width: 24px; height: 24px; background: var(--dark); border-radius: 6px;
    position: relative;
  }
  .logo-icon::after {
    content: ''; position: absolute; top: 6px; left: 6px; width: 12px; height: 3px; background: var(--lime); border-radius: 2px;
  }
  
  .nav-menu { display: flex; flex-direction: column; gap: 8px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 20px; border-radius: 100px;
    color: var(--text-muted); font-weight: 600; font-size: 15px;
    text-decoration: none; cursor: pointer; transition: all 0.2s;
  }
  .nav-item:hover { color: var(--text-main); background: #F8F9FA; }
  .nav-item.active { background: var(--dark); color: white; }

  /* ===== ЦЕНТРАЛЬНАЯ ЧАСТЬ (ТРЕНИРОВКИ) ===== */
  .main-content {
    display: flex;
    flex-direction: column;
    gap: 20px;
    overflow-y: auto;
    padding-right: 10px;
    scrollbar-width: thin;
    scrollbar-color: #ccc transparent;
  }

  .header-area { margin-bottom: 10px; }
  .header-area h1 { font-size: 32px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
  .header-area p { color: var(--text-muted); font-size: 15px; }

  /* Карточки тренировок */
  .workouts-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }
  
  .workout-card {
    background: var(--card-bg);
    border-radius: var(--radius-xl);
    padding: 24px;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    min-height: 180px;
    border: 1px solid transparent;
  }
  .workout-card:hover { transform: translateY(-4px); box-shadow: var(--shadow-hover); border-color: var(--border-color); }
  
  .card-top { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
  .badge {
    background: var(--bg-color); color: var(--text-main);
    font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 100px;
  }
  .arrow-icon {
    width: 32px; height: 32px; border-radius: 50%; background: var(--bg-color);
    display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: bold;
  }
  
  .workout-card h3 { font-size: 20px; font-weight: 700; margin-bottom: 6px; line-height: 1.3; }
  .workout-card p { font-size: 14px; color: var(--text-muted); }
  
  .status-pill {
    margin-top: 20px;
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 600; padding: 8px 14px; border-radius: 100px;
    background: var(--bg-color); width: fit-content;
  }
  .status-pill.done { background: var(--lime); color: var(--dark); }
  .status-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  /* ===== ЭКРАН С УПРАЖНЕНИЯМИ (внутри карточки) ===== */
  #workoutDetails { display: none; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .back-btn {
    background: var(--card-bg); border: none; padding: 12px 24px; border-radius: 100px;
    font-size: 15px; font-weight: 600; color: var(--text-main); box-shadow: var(--shadow);
    cursor: pointer; margin-bottom: 24px; display: inline-flex; align-items: center; gap: 8px;
  }
  
  .details-title { font-size: 28px; font-weight: 800; margin-bottom: 24px; }

  .exercise-block {
    background: var(--card-bg); border-radius: var(--radius-lg); padding: 24px;
    margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .ex-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px; }
  .ex-name { font-size: 18px; font-weight: 700; }
  .ex-note { font-size: 14px; color: var(--text-muted); margin-top: 4px; }
  
  .sets-row { display: flex; gap: 12px; flex-wrap: wrap; }
  .set-btn {
    width: 52px; height: 52px; border-radius: 50%;
    border: 2px solid var(--border-color); background: var(--card-bg);
    display: flex; justify-content: center; align-items: center;
    font-size: 16px; font-weight: 700; color: var(--text-muted);
    cursor: pointer; transition: all 0.2s;
  }
  .set-btn:hover { border-color: var(--text-main); color: var(--text-main); }
  .set-btn.active { background: var(--lime); border-color: var(--lime); color: var(--dark); transform: scale(1.05); }

  .finish-btn {
    width: 100%; padding: 20px; border-radius: 100px; border: none;
    background: var(--dark); color: white; font-size: 18px; font-weight: 700;
    cursor: pointer; margin-top: 10px; transition: background 0.2s;
  }
  .finish-btn:hover { background: #000; }
  .finish-btn:disabled { background: #E0E0E0; color: #999; cursor: not-allowed; }

  /* ===== ПРАВАЯ КОЛОНКА (КАЛЕНДАРЬ) ===== */
  .right-panel {
    background: var(--card-bg);
    border-radius: var(--radius-xl);
    padding: 30px 20px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
  }

  .cal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
  .cal-header h3 { font-size: 18px; font-weight: 800; text-transform: capitalize; }
  .cal-nav-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border-color);
    background: var(--card-bg); cursor: pointer; font-size: 18px; color: var(--text-main);
    display: flex; align-items: center; justify-content: center;
  }
  .cal-nav-btn:hover { background: var(--bg-color); }

  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; }
  .dow { font-size: 13px; color: var(--text-muted); font-weight: 600; margin-bottom: 8px; }
  .day {
    aspect-ratio: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 50%; font-size: 14px; font-weight: 600; color: var(--text-main);
    cursor: default; transition: 0.2s;
  }
  .day.empty { visibility: hidden; }
  .day.today { border: 2px solid var(--dark); }
  .day.done { background: var(--lime); color: var(--dark); }
  
  .history-card {
    margin-top: auto; background: var(--dark); border-radius: var(--radius-lg); padding: 24px;
    color: white; text-align: center;
  }
  .history-card h4 { font-size: 14px; color: #88909D; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  .history-card .number { font-size: 32px; font-weight: 800; color: var(--lime); }

  /* ===== АДАПТИВНОСТЬ (Мобильные) ===== */
  @media (max-width: 1024px) {
    .app-container { grid-template-columns: 1fr; height: auto; }
    .sidebar { display: none; /* Скрываем меню на телефоне для экономии места */ }
    .right-panel { order: 2; } /* Календарь уходит вниз */
    .main-content { order: 1; padding-right: 0; }
    .workouts-grid { grid-template-columns: 1fr; }
  }

  /* Уведомление */
  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--dark); color: white; padding: 16px 32px; border-radius: 100px;
    font-weight: 600; box-shadow: 0 10px 30px rgba(0,0,0,0.2); opacity: 0; 
    transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 1000;
  }
  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- 1. БОКОВАЯ ПАНЕЛЬ -->
  <aside class="sidebar">
    <div class="logo">
      <div class="logo-icon"></div>
      FitLab
    </div>
    <nav class="nav-menu">
      <a href="#" class="nav-item active">
        <span>🏠</span> Главная
      </a>
      <a href="#" class="nav-item" onclick="alert('История тренировок будет здесь!')">
        <span>📊</span> Статистика
      </a>
      <a href="#" class="nav-item" onclick="alert('Настройки профиля')">
        <span>⚙️</span> Настройки
      </a>
    </nav>
  </aside>

  <!-- 2. ЦЕНТРАЛЬНАЯ ЧАСТЬ -->
  <main class="main-content">
    
    <!-- Экран списка тренировок -->
    <div id="homeScreen">
      <div class="header-area">
        <h1>Твои тренировки</h1>
        <p>План: Рекомпозиция + подтягивания</p>
      </div>
      
      <div class="workouts-grid" id="workoutsGrid">
        <!-- Генерируется через JS -->
      </div>
    </div>

    <!-- Экран выполнения тренировки -->
    <div id="workoutDetails">
      <button class="back-btn" id="backBtn">← Назад к списку</button>
      <div class="details-title" id="detailsTitle"></div>
      <div id="exercisesContainer">
        <!-- Генерируется через JS -->
      </div>
      <button class="finish-btn" id="finishBtn">Завершить тренировку</button>
    </div>

  </main>

  <!-- 3. ПРАВАЯ ПАНЕЛЬ (КАЛЕНДАРЬ) -->
  <aside class="right-panel">
    <div class="cal-header">
      <button class="cal-nav-btn" id="prevMonth">‹</button>
      <h3 id="calTitle"></h3>
      <button class="cal-nav-btn" id="nextMonth">›</button>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    
    <div class="history-card">
      <h4>Всего закрыто</h4>
      <div class="number" id="totalDone">0</div>
      <div style="font-size: 13px; color: #88909D; margin-top: 4px;">тренировок</div>
    </div>
  </aside>

</div>

<div class="toast" id="toast">Тренировка сохранена!</div>

<script>
// ===== ДАННЫЕ ТРЕНИРОВОК =====
const WORKOUTS = {
  "UP-1": {
    name: "День 1. Верх (Сила)",
    exercises: [
      { name: "Подтягивания (прогрессия)", note: "4 подхода", sets: 4 },
      { name: "Жим гантелей лёжа", note: "4 × 6–10", sets: 4 },
      { name: "Тяга верхнего блока широким хватом", note: "3 × 8–12", sets: 3 },
      { name: "Жим гантелей сидя", note: "3 × 8–12", sets: 3 },
      { name: "Тяга гантели в наклоне", note: "3 × 8–12", sets: 3 },
      { name: "Разведения гантелей в стороны", note: "3 × 12–15", sets: 3 },
      { name: "Бицепс + трицепс (суперсет)", note: "3 × 10–15", sets: 3 }
    ]
  },
  "LOW-1": {
    name: "День 2. Низ (Ягодицы)",
    exercises: [
      { name: "Приседания со штангой / гоблет", note: "4 × 6–10", sets: 4 },
      { name: "Румынская тяга", note: "4 × 8–12", sets: 4 },
      { name: "Хип-траст / ягодичный мост", note: "4 × 8–12", sets: 4 },
      { name: "Болгарские выпады", note: "3 × 10–12", sets: 3 },
      { name: "Разгибания ног", note: "3 × 12–15", sets: 3 },
      { name: "Подъёмы на носки стоя", note: "3 × 12–15", sets: 3 }
    ]
  },
  "UP-2": {
    name: "День 3. Верх (Объём)",
    exercises: [
      { name: "Подтягивания (прогрессия)", note: "4 подхода", sets: 4 },
      { name: "Жим гантелей на наклонной", note: "4 × 8–12", sets: 4 },
      { name: "Горизонтальная тяга", note: "4 × 8–12", sets: 4 },
      { name: "Жим гантелей сидя (нейтральный)", note: "3 × 10–12", sets: 3 },
      { name: "Разведения на задние дельты + пулловер", note: "3 × 12–15", sets: 3 },
      { name: "Французский жим + молотки", note: "3 × 10–15", sets: 3 }
    ]
  },
  "LOW-2": {
    name: "День 4. Низ (Задняя)",
    exercises: [
      { name: "Фронтальные приседания", note: "3–4 × 8–12", sets: 4 },
      { name: "Румынская тяга / становая", note: "4 × 8–12", sets: 4 },
      { name: "Хип-траст с паузой", note: "4 × 10–15", sets: 4 },
      { name: "Зашагивания на тумбу", note: "3 × 10–12", sets: 3 },
      { name: "Сгибания ног / good mornings", note: "3 × 10–15", sets: 3 },
      { name: "Подъёмы на носки сидя", note: "3 × 12–15", sets: 3 }
    ]
  }
};

// ===== СОСТОЯНИЕ =====
let currentWorkout = null;
let progress = load("progress_final", {}); 
let history = load("history_final", []); // [ { date: "YYYY-MM-DD", code: "UP-1" } ]

function load(k, def) { try { return JSON.parse(localStorage.getItem(k)) ?? def; } catch { return def; } }
function save(k, v) { localStorage.setItem(k, JSON.stringify(v)); }

function initProgress(code) {
  if (!progress[code]) {
    progress[code] = WORKOUTS[code].exercises.map(ex => new Array(ex.sets).fill(false));
  }
}

// ===== РЕНДЕР ГЛАВНОГО ЭКРАНА =====
function renderHome() {
  const grid = document.getElementById("workoutsGrid");
  grid.innerHTML = "";
  
  const todayStr = new Date().toISOString().slice(0, 10);
  const doneToday = history.filter(h => h.date === todayStr).map(h => h.code);

  Object.entries(WORKOUTS).forEach(([code, w]) => {
    const card = document.createElement("div");
    card.className = "workout-card";
    const isDone = doneToday.includes(code);
    
    card.innerHTML = `
      <div>
        <div class="card-top">
          <div class="badge">${code}</div>
          <div class="arrow-icon">↗</div>
        </div>
        <h3>${w.name}</h3>
        <p>${w.exercises.length} упражнений</p>
      </div>
      <div class="status-pill ${isDone ? 'done' : ''}">
        <div class="dot"></div>
        ${isDone ? 'Выполнено' : 'Не начато'}
      </div>
    `;
    
    card.onclick = () => openWorkout(code);
    grid.appendChild(card);
  });
}

// ===== ОТКРЫТИЕ ТРЕНИРОВКИ =====
function openWorkout(code) {
  currentWorkout = code;
  initProgress(code);
  
  document.getElementById("homeScreen").style.display = "none";
  document.getElementById("workoutDetails").style.display = "block";
  document.getElementById("detailsTitle").textContent = WORKOUTS[code].name;
  
  renderExercises();
  document.querySelector('.main-content').scrollTo(0,0);
}

// ===== РЕНДЕР УПРАЖНЕНИЙ =====
function renderExercises() {
  const container = document.getElementById("exercisesContainer");
  container.innerHTML = "";
  
  const workout = WORKOUTS[currentWorkout];
  const states = progress[currentWorkout];
  
  let totalSets = 0;
  let doneSets = 0;

  workout.exercises.forEach((ex, exIndex) => {
    const block = document.createElement("div");
    block.className = "exercise-block";
    
    block.innerHTML = `
      <div class="ex-header">
        <div>
          <div class="ex-name">${exIndex + 1}. ${ex.name}</div>
          <div class="ex-note">${ex.note}</div>
        </div>
      </div>
      <div class="sets-row" id="sets-${exIndex}"></div>
    `;
    
    const setsRow = block.querySelector(`#sets-${exIndex}`);
    
    for (let i = 0; i < ex.sets; i++) {
      const isDone = states[exIndex][i];
      totalSets++;
      if (isDone) doneSets++;

      const btn = document.createElement("div");
      btn.className = "set-btn" + (isDone ? " active" : "");
      btn.textContent = i + 1;
      
      btn.onclick = () => {
        states[exIndex][i] = !states[exIndex][i];
        save("progress_final", progress);
        renderExercises();
      };
      
      setsRow.appendChild(btn);
    }
    container.appendChild(block);
  });

  const finishBtn = document.getElementById("finishBtn");
  finishBtn.textContent = `Завершить (${doneSets} из ${totalSets})`;
  finishBtn.disabled = doneSets === 0;
}

// ===== ЗАВЕРШЕНИЕ ТРЕНИРОВКИ =====
document.getElementById("finishBtn").onclick = () => {
  const todayStr = new Date().toISOString().slice(0, 10);
  
  if (!history.some(h => h.date === todayStr && h.code === currentWorkout)) {
    history.push({ date: todayStr, code: currentWorkout });
    save("history_final", history);
  }
  
  progress[currentWorkout] = WORKOUTS[currentWorkout].exercises.map(ex => new Array(ex.sets).fill(false));
  save("progress_final", progress);
  
  showToast("Тренировка успешно завершена! 💪");
  
  document.getElementById("workoutDetails").style.display = "none";
  document.getElementById("homeScreen").style.display = "block";
  renderHome();
  renderCalendar();
};

document.getElementById("backBtn").onclick = () => {
  document.getElementById("workoutDetails").style.display = "none";
  document.getElementById("homeScreen").style.display = "block";
  renderHome();
};

// ===== КАЛЕНДАРЬ =====
let calDate = new Date();
const DOW = ["Пн","Вт","Ср","Чт","Пт","Сб","Вс"];

function renderCalendar() {
  const y = calDate.getFullYear(), m = calDate.getMonth();
  
  // Название месяца
  const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
  document.getElementById("calTitle").textContent = monthNames[m] + " " + y;

  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";
  
  // Дни недели
  DOW.forEach(d => {
    const el = document.createElement("div");
    el.className = "dow"; el.textContent = d;
    grid.appendChild(el);
  });

  const first = new Date(y, m, 1);
  const startOffset = (first.getDay() + 6) % 7; // Пн = 0
  const daysInMonth = new Date(y, m + 1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0, 10);

  // Пустые ячейки
  for (let i = 0; i < startOffset; i++) {
    const el = document.createElement("div");
    el.className = "day empty";
    grid.appendChild(el);
  }

  // Дни месяца
  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${y}-${String(m+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const el = document.createElement("div");
    el.className = "day";
    
    if (dateStr === todayStr) el.classList.add("today");
    
    const hasWorkout = history.some(h => h.date === dateStr);
    if (hasWorkout) el.classList.add("done");

    el.textContent = d;
    grid.appendChild(el);
  }
  
  // Обновляем счетчик
  document.getElementById("totalDone").textContent = history.length;
}

document.getElementById("prevMonth").onclick = () => { calDate.setMonth(calDate.getMonth() - 1); renderCalendar(); };
document.getElementById("nextMonth").onclick = () => { calDate.setMonth(calDate.getMonth() + 1); renderCalendar(); };

// ===== ТОСТ =====
function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 3000);
}

// ===== ЗАПУСК =====
renderHome();
renderCalendar();
</script>
</body>
</html>
